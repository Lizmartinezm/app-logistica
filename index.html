<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>App Logistica</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="toolbar">
        <div>
          <p class="eyebrow">Operacion logistica</p>
          <h1>Programacion de rutas</h1>
        </div>
        <div class="actions">
          <button id="downloadExcel" disabled>Descargar Excel</button>
          <button id="downloadPdf" disabled>Descargar PDF</button>
        </div>
      </section>

      <section class="controls">
        <label>
          Base de datos Excel
          <input id="fileInput" type="file" accept=".xlsx,.xls" />
        </label>
        <label>
          Fecha
          <input id="routeDate" type="date" value="2026-06-01" />
        </label>
        <label>
          Departamento
          <input id="departmentFilter" type="text" value="CUNDINAMARCA" />
        </label>
        <button id="generateRoute">Generar ruta</button>
      </section>

      <section class="summary" id="summary">
        <div>
          <span>Entregas</span>
          <strong id="deliveriesCount">0</strong>
        </div>
        <div>
          <span>Recogidas</span>
          <strong id="pickupsCount">0</strong>
        </div>
        <div>
          <span>Total servicios</span>
          <strong id="totalCount">0</strong>
        </div>
      </section>

      <section class="sheet-preview">
        <div class="route-section">
          <div class="section-title">PROGRAMACION DE ENTREGAS</div>
          <div class="date-row"><strong>FECHA:</strong><span id="deliveryDateLabel">-</span></div>
          <div class="table-wrap">
            <table id="deliveriesTable"></table>
          </div>
        </div>

        <div class="route-section">
          <div class="section-title">PROGRAMACION DE RECOGIDAS</div>
          <div class="date-row"><strong>FECHA:</strong><span id="pickupDateLabel">-</span></div>
          <div class="table-wrap">
            <table id="pickupsTable"></table>
          </div>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
